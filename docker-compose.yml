# Local development dependencies only. Production topology lives in Phase 6.
#
# Start with: pnpm services:up      Stop with: pnpm services:down
#
# NOTE: these ports bind to 127.0.0.1, not 0.0.0.0, so nothing here is reachable
# from outside this machine even on an untrusted network.

services:
  redis:
    image: redis:7.4-alpine
    container_name: urlgen-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    container_name: urlgen-clickhouse
    ports:
      - "127.0.0.1:8123:8123" # HTTP interface — what @clickhouse/client uses
      - "127.0.0.1:9000:9000" # native protocol, for clickhouse-client
    environment:
      CLICKHOUSE_DB: urlgen
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: urlgen-dynamodb
    # sharedDb keeps one database file regardless of credentials, so tests and the
    # dev server see the same tables instead of silently getting separate ones.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  redis-data:
  clickhouse-data:
  dynamodb-data:
